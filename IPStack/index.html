<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Stack API — Geolocalização de IP</title>
    <meta name="description"
        content="Consulte informações de geolocalização de qualquer endereço IP usando a API IPStack.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background animado -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <main class="container">

        <!-- Cabeçalho -->
        <header class="header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M2 12h20" />
                    <path
                        d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10A15.3 15.3 0 0 1 12 2z" />
                </svg>
                <h1>IP Stack <span class="accent">API</span></h1>
            </div>
            <p class="subtitle">Geolocalização de endereços IP em tempo real</p>

            <!-- Botão para configurar a chave API -->
            <button id="btn_open_modal" class="btn btn-api-key" type="button">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" />
                </svg>
                <span id="api_key_status">Configurar Chave API</span>
            </button>
        </header>

        <!-- Card: Consultar IP -->
        <section class="glass-card card-lookup">
            <div class="card-header">
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.3-4.3" />
                </svg>
                <h2>Consultar IP</h2>
            </div>
            <div class="input-group">
                <input id="in_ip" type="text" placeholder="Ex: 134.201.250.155">
                <button id="btn_ip" class="btn btn-primary">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="m12 5 7 7-7 7" />
                    </svg>
                    Buscar
                </button>
            </div>
        </section>

        <!-- Card: Obtenção Automática -->
        <section class="glass-card card-auto">
            <div class="card-header">
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" />
                    <circle cx="12" cy="10" r="3" />
                </svg>
                <h2>Obtenção Automática</h2>
            </div>
            <p class="card-description">Detecte automaticamente as informações do seu IP atual.</p>
            <button id="btn_ip_check" class="btn btn-secondary">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v4" />
                    <path d="m16.2 7.8 2.9-2.9" />
                    <path d="M18 12h4" />
                    <path d="m16.2 16.2 2.9 2.9" />
                    <path d="M12 18v4" />
                    <path d="m4.9 19.1 2.9-2.9" />
                    <path d="M2 12h4" />
                    <path d="m4.9 4.9 2.9 2.9" />
                </svg>
                Detectar meu IP
            </button>
        </section>

        <!-- Card: Resultados -->
        <section id="txt_info" class="glass-card card-results hidden"></section>

    </main>

    <!-- Popup: Chave API -->
    <div id="modal_overlay" class="modal-overlay hidden" aria-hidden="true">
        <div class="modal-glass" role="dialog" aria-label="Configurar Chave API">

            <div class="modal-header">
                <div class="modal-title">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" />
                    </svg>
                    <h2>Chave de API</h2>
                </div>
                <button id="btn_close_modal" class="modal-close" type="button" aria-label="Fechar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>

            <p class="modal-description">
                Insira sua chave de acesso da
                <a href="https://ipstack.com" target="_blank" rel="noopener">IPStack</a>
                para utilizar a API.
            </p>

            <div class="input-group">
                <input id="in_api" type="text" placeholder="Cole sua chave aqui..." autocomplete="off">
            </div>

            <button id="btn_save_api" class="btn btn-primary modal-save" type="button">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 6 9 17l-5-5" />
                </svg>
                Salvar
            </button>

        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
